name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - masters
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Ensure builds branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api repos/${{ github.repository }}/git/refs/heads/builds --silent 2>/dev/null; then
            echo "Creating empty 'builds' branch..."
            gh api repos/${{ github.repository }}/git/refs \
              -X POST \
              -f ref=refs/heads/builds \
              -f sha=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fi

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup Git Identity
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew clean make --no-build-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m"
          ./gradlew makePluginsJson --no-build-cache || true

      - name: Copy Build Artifacts
        run: |
          cd $GITHUB_WORKSPACE/src
          find . -name "*.cs3" -path "*/build/*" -exec cp -f {} $GITHUB_WORKSPACE/builds/ \;
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

      - name: Push Compiled Extensions
        run: |
          cd $GITHUB_WORKSPACE/builds
          git add .
          git diff-index --quiet HEAD || git commit -m "Build $GITHUB_SHA"
          git push origin builds